stages:
  - build
  - test

build-job:
  image: node:24-bookworm-slim
  stage: build
  script:
    - npm ci
    - npm run build

unit-test-job:
  image: node:24-bookworm-slim
  stage: test
  script:
    - npm ci
    - npm run test

lint-test-job:
  image: node:24-bookworm-slim
  stage: test
  script:
    - npm ci
    - npm run lint